name: Update Indexers List

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [update-indexers]

env:
  DOCS_REPO: 'autobrr/autobrr.com'
  SOURCE_REPO: 'autobrr/autobrr'
  DOCS_PATH: 'autobrr.com'
  SOURCE_PATH: 'autobrr'

jobs:
  update-indexers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out autobrr.com repo
      uses: actions/checkout@v7
      with:
        repository: ${{ env.DOCS_REPO }}
        path: ${{ env.DOCS_PATH }}
        token: ${{ secrets.DOCS_TOKEN }}

    - name: Check out autobrr repo
      uses: actions/checkout@v7
      with:
        repository: ${{ env.SOURCE_REPO }}
        path: ${{ env.SOURCE_PATH }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: pip install pyyaml

    - name: Update indexers list
      run: |
        # Verify source paths exist before running script
        if [ ! -d "${{ env.SOURCE_PATH }}/internal/indexer/definitions" ]; then
          echo "Error: Required definitions directory not found"
          exit 1
        fi
        
        echo "Running update script..."
        cd ${{ env.SOURCE_PATH }}
        python3 scripts/update-indexers.py
        echo "Update script completed"
        
        # Verify output files were generated
        echo "Checking generated files..."
        ls -l ../${{ env.DOCS_PATH }}/snippets/indexers.mdx ../${{ env.DOCS_PATH }}/snippets/freeleech.mdx || true

    - name: Create or update pull request
      run: |
        set -euo pipefail
        cd ${{ env.DOCS_PATH }}

        BRANCH="automation/update-indexers"
        TITLE="docs: update indexers and freeleech support lists"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git switch -C "$BRANCH"
        git add snippets/indexers.mdx snippets/freeleech.mdx

        if git diff --cached --quiet; then
          echo "Generated tables match main; nothing to do."
          exit 0
        fi

        # Reuse the fixed branch across runs; skip the push when its tip already
        # carries this exact content, so the daily cron doesn't rewrite the branch
        # (new commit + CI + notifications) without an actual change.
        if git fetch origin "$BRANCH" 2>/dev/null; then
          if git diff --quiet FETCH_HEAD -- snippets/indexers.mdx snippets/freeleech.mdx; then
            echo "Branch $BRANCH is already up to date."
          else
            git commit -m "$TITLE"
            git push --force origin "$BRANCH"
          fi
        else
          git commit -m "$TITLE"
          git push origin "$BRANCH"
        fi

        existing="$(gh pr list --repo ${{ env.DOCS_REPO }} --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)"
        if [ -n "$existing" ]; then
          echo "Existing PR #$existing updated via branch push."
        else
          gh pr create \
            --repo ${{ env.DOCS_REPO }} \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated update of the indexers and freeleech support lists from definitions" \
            --label "documentation"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.DOCS_TOKEN }}