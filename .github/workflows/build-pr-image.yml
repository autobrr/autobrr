name: build-pr-image

# Builds and pushes a Docker image for a pull request from a fork.
# The workflow file always comes from the ref it is dispatched on, only the
# build context is checked out from the fork, so fork code never gets to
# change what runs with the repository token.
# Caches are restore-only: fork code runs before a save, and release.yml
# restores the same keys. The pnpm key mirrors setup-node's
# node-cache-<os>-<arch>-pnpm-<lockfile hash> so develop's caches still hit.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number
      platforms:
        description: 'Comma separated list of platforms to build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: '24.15.0'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-pr-image-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker image for PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ inputs.pr }}" --repo "${{ github.repository }}" \
            --json headRefOid,headRepository,headRepositoryOwner,state \
            --jq '"sha=\(.headRefOid)\nrepo=\(.headRepositoryOwner.login)/\(.headRepository.name)\nstate=\(.state)"' \
            | tee -a "$GITHUB_OUTPUT"

      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: web/package.json

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: node-cache-Linux-x64-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            node-cache-Linux-x64-pnpm

      - name: Fetch web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        working-directory: web
        run: CI= pnpm run build

      # ci.Dockerfile builds with -pgo=cpu.pprof; there is no combined profile
      # on this path and go build accepts an empty one.
      - name: Provide empty PGO profile
        run: touch cpu.pprof

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=pr-${{ inputs.pr }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.pr.outputs.sha }}
            org.opencontainers.image.version=pr-${{ inputs.pr }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./distrib/docker/ci.Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=pr-${{ inputs.pr }}
            REVISION=${{ steps.pr.outputs.sha }}
          cache-from: type=gha,scope=pr-${{ inputs.pr }}
          cache-to: type=gha,mode=max,scope=pr-${{ inputs.pr }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "Built \`${{ env.REGISTRY_IMAGE }}:pr-${{ inputs.pr }}\`"
            echo
            echo "- source: \`${{ steps.pr.outputs.repo }}@${{ steps.pr.outputs.sha }}\` (PR ${{ steps.pr.outputs.state }})"
            echo "- platforms: \`${{ inputs.platforms }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
