---
version: 2
#id: Samaritano
name: Samaritano
identifier: samaritano
description: Samaritano (SAM) is a Brazilian general private torrent tracker focused on movies, TV shows, and more.
language: pt-BR
urls:
  - https://samaritano.cc/
privacy: private
protocol: torrent
supports:
  - irc
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key (RID)
    help: "Go to My Settings > Settings -> RSS Key, and copy your RSS Key (RID)"

irc:
  network: SamaritanoNet
  server: irc.samaritano.cc
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user|bot

  channels:
    - name: "#samaritano"
      announcers:
        - Overlord
      parse:
        type: single
        lines:
          - pattern: '\[(?P<category>.+?)\] \[(?P<releaseTags>.+?)\] \[(?P<releaseName>.+?)\] \[TORRENT ID: (?P<torrentId>\d+)\] \[(?P<torrentSize>.+?)\](?: \[tmdb-(?P<tmdb>\d+)\])?'
            tests:
              - line: "[Filmes] [WEB-DL] [Example Movie 2024 1080p HMAX WEB-DL DDP2.0 H.265 DUAL-Group] [TORRENT ID: 10837] [2.1 GiB] [tmdb-912649]"
                expect:
                  category: Filmes
                  releaseTags: WEB-DL
                  releaseName: Example Movie 2024 1080p HMAX WEB-DL DDP2.0 H.265 DUAL-Group
                  torrentId: "10837"
                  torrentSize: "2.1 GiB"
                  tmdb: 912649

              - line: "[Series] [WEB-DL] [Example Series S01 2160p AMZN WEB-DL DTS-HD MA 5.1 DV HDR H.265-Group] [TORRENT ID: 10840] [43.1 GiB] [tmdb-72710]"
                expect:
                  category: Series
                  releaseTags: WEB-DL
                  releaseName: Example Series S01 2160p AMZN WEB-DL DTS-HD MA 5.1 DV HDR H.265-Group
                  torrentId: "10840"
                  torrentSize: "43.1 GiB"
                  tmdb: 72710

              - line: "[Livros] [ePUB] [Example Book - Example Author [2026] [ENG]] [TORRENT ID: 10003] [3.35 MiB]"
                expect:
                  category: Livros
                  releaseTags: ePUB
                  releaseName: Example Book - Example Author [2026] [ENG]
                  torrentId: "10003"
                  torrentSize: "3.35 MiB"
                  tmdb:

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
