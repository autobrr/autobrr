---
version: 2
#id: filelist
name: FileList
identifier: fl
description: FileList (FL) is a ROMANIAN private torrent tracker for MOVIES / TV / GENERAL
language: en-us
urls:
  - https://filelist.io/
  - https://thefl.org/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: custom
settings:
  - name: passkey
    type: secret
    required: true
    label: Passkey
    help: "The passkey in your profile."

irc:
  network: FileList
  server: irc.filelist.io
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_dl

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#announce"
      announcers:
        - Announce
      parse:
        type: single
        lines:
          - pattern: 'New Torrent: (?P<releaseName>.*?) (?:-- \[(?P<freeleech>FreeLeech)!] )?(?:-- \[(?P<origin>Internal)!] )?-- \[(?P<category>.*)] \[(?P<torrentSize>.*)] -- (?P<baseUrl>https?:\/\/filelist.io\/).*id=(?P<torrentId>.*) -- by (?P<uploader>.*)'
            tests:
              - line: 'New Torrent: This.Really.Old.Movie.1965.DVDRip.DD1.0.x264 -- [Filme SD] [1.91 GB] -- https://filelist.io/details.php?id=000000 -- by uploader1'
                expect:
                  releaseName: This.Really.Old.Movie.1965.DVDRip.DD1.0.x264
                  freeleech: ""
                  origin: ""
                  category: Filme SD
                  torrentSize: 1.91 GB
                  baseUrl: https://filelist.io/
                  torrentId: "000000"
                  uploader: uploader1

              - line: 'New Torrent: This.New.Movie.2021.1080p.Blu-ray.AVC.DTS-HD.MA.5.1-BEATRIX -- [FreeLeech!] -- [Filme Blu-Ray] [26.78 GB] -- https://filelist.io/details.php?id=000000 -- by uploader1'
                expect:
                  releaseName: This.New.Movie.2021.1080p.Blu-ray.AVC.DTS-HD.MA.5.1-BEATRIX
                  freeleech: FreeLeech
                  origin: ""
                  category: Filme Blu-Ray
                  torrentSize: 26.78 GB
                  baseUrl: https://filelist.io/
                  torrentId: "000000"
                  uploader: uploader1

              - line: 'New Torrent: This.New.Movie.2021.1080p.Remux.AVC.DTS-HD.MA.5.1-playBD -- [FreeLeech!] -- [Internal!] -- [Filme Blu-Ray] [17.69 GB] -- https://filelist.io/details.php?id=000000 -- by uploader1'
                expect:
                  releaseName: This.New.Movie.2021.1080p.Remux.AVC.DTS-HD.MA.5.1-playBD
                  freeleech: FreeLeech
                  origin: Internal
                  category: Filme Blu-Ray
                  torrentSize: 17.69 GB
                  baseUrl: https://filelist.io/
                  torrentId: "000000"
                  uploader: uploader1

        match:
          infourl: "/details.php?id={{ .torrentId }}"
          downloadurl: "/download.php?id={{ .torrentId }}&passkey={{ .passkey }}"
