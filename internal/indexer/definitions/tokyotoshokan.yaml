---
version: 2
#id: tokyotosho
name: Tokyo Toshokan
identifier: tokyotosho
description: A BitTorrent Library for Japanese Media
language: en-us
urls:
  - https://
privacy: public
protocol: torrent
supports:
  - irc

irc:
  network: Rizon
  server: irc.rizon.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your main user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#tokyotosho"
      announcers:
        - "TokyoTosho"
      parse:
        type: multi
        lines:
          - pattern: '^Release [0-9]*: \[(?P<category>.*?)\] (?P<releaseName>.*)'
            tests:
              - line: 'Release 1748839: [Anime] SOMETITLE-007'
                expect:
                  category: Anime
                  releaseName: SOMETITLE-007

          - pattern: '^Torrent: https:\/\/(?P<torrentId>.*)'
            tests:
              - line: 'Torrent: https://example.com/torrents/sha123/torrentname-007.torrent'
                expect:
                  torrentId: example.com/torrents/sha123/torrentname-007.torrent

          - pattern: '^Size: (?P<size>\d+.?\d*[KMGTP]?B)( \| Comment: (.*))?'
            tests:
              - line: 'Size: 7.21GB | Comment: A comment on the torrent left by the author'
                expect:
                  size: 7.21GB

        match:
          downloadurl: "{{ .torrentId }}"
