              uploadVolumeFactor: 2
            "7": # 75% off + double upload
              downloadVolumeFactor: 0.25
              uploadVolumeFactor: 2
            "8": # 50% off + double upload
              downloadVolumeFactor: 0.5
              uploadVolumeFactor: 2
            "9": # 25% off + double upload
              downloadVolumeFactor: 0.75
              uploadVolumeFactor: 2
            "10": # Neutral leech, sent with or without double upload
              downloadVolumeFactor: 0
              uploadVolumeFactor: 0

