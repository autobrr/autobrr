        mappings:
          announceTypeEnum:
            "0":
              announceType: NEW
            "2":
              announceType: PROMO # freeleech, discount, neutral leech or double upload added, or re-announced by staff
            "4":
              announceType: RESURRECTED # seeded again after 7+ days without a seeder

          categoryEnum:
            "1":
              category: "Feature Film"
            "2":
              category: "Short Film"
            "3":
              category: "TV Season"
            "4":
              category: "TV Episode"

          originEnum:
            "0":
              origin: "P2P"
            "1":
              origin: "SCENE"
            "2":
              origin: "INTERNAL"

          freeleechEnum:
            "0": # Normal
              downloadVolumeFactor: 1
              uploadVolumeFactor: 1
            "1": # Freeleech
              downloadVolumeFactor: 0
              uploadVolumeFactor: 1
            "2": # 75% off
              downloadVolumeFactor: 0.25
              uploadVolumeFactor: 1
            "3": # 50% off
              downloadVolumeFactor: 0.5
              uploadVolumeFactor: 1
            "4": # 25% off
              downloadVolumeFactor: 0.75
              uploadVolumeFactor: 1
            "5": # Double upload
