---
version: 2
#id: norbits
name: Norbits
identifier: norbits
description: NorBits is a Norwegian Private site for MOVIES / TV / GENERAL
language: nb-NO
urls:
  - https://www.norbits.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: custom
settings:
  - name: passkey
    type: secret
    required: true
    label: Passkey
    help: "Copy passkey from a download link"

irc:
  network: Norbits
  server: irc.norbits.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: true
      label: NickServ Account
      help: NickServ account. Use primary nick or ask staff to allow grouped nick.

    - name: auth.password
      type: secret
      required: true
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#Norbits"
      announcers:
        - NB
      parse:
        type: single
        lines:
          - pattern: 'Ny torrent: (?P<releaseName>.*) :: Kategori: (?P<category>.*) :: Scene: (?P<scene>.*) :: St.+rrelse: (?P<torrentSize>.*) :: (?P<baseUrl>https?\:\/\/[^\/]+\/).*[\?]id=(?P<torrentId>\d+)'
            tests:
              - line: 'Ny torrent: Movie.2010.1080p.BluRay.x264.DTS-HD MA 5.1-OMEGA :: Kategori: Filmer/H.264/HD-1080p/i/Encode :: Scene: Nei :: St�rrelse: 9.69 GB :: https://norbits.net/details.php?id=000000'
                expect:
                  releaseName: Movie.2010.1080p.BluRay.x264.DTS-HD MA 5.1-OMEGA
                  category: Filmer/H.264/HD-1080p/i/Encode
                  scene: Nei
                  torrentSize: 9.69 GB
                  baseUrl: https://norbits.net/
                  torrentId: "000000"

              - line: 'Ny torrent: Some.TV.Show.s01e01.NORDIC.720p.DSNP.WEBRiP.DD.5.1.h264 :: Kategori: TV/H.264/HD-720p/Encode :: Scene: Nei :: St�rrelse: 891.04 MB :: https://norbits.net/details.php?id=000000'
                expect:
                  releaseName: Some.TV.Show.s01e01.NORDIC.720p.DSNP.WEBRiP.DD.5.1.h264
                  category: TV/H.264/HD-720p/Encode
                  scene: Nei
                  torrentSize: 891.04 MB
                  baseUrl: https://norbits.net/
                  torrentId: "000000"

        match:
          infourl: "/details.php?id={{ .torrentId }}"
          downloadurl: "/download.php?id={{ .torrentId }}&passkey={{ .passkey }}"
