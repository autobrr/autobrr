---
version: 2
#id: happyfappy
name: HappyFappy
identifier: happyfappy
description: HappyFappy (HF) is a private torrent tracker for XXX
language: en-US
urls:
  - https://www.happyfappy.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: Gazelle
settings:
  - name: authkey
    type: secret
    required: true
    label: Auth key
    help: Right click DL on a torrent and get the authkey.

  - name: torrent_pass
    type: secret
    required: true
    label: Torrent pass
    help: Right click DL on a torrent and get the torrent_pass.

irc:
  network: Rizon
  server: irc.rizon.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your main user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#HF-Announce"
      announcers:
        - "WizBoy"
      parse:
        type: single
        lines:
          - pattern: '^Name: (?P<releaseName>.+) Freeleech \[(?P<freeleech>[^\]]*)\] Size \[(?P<torrentSize>[^\]]+)\] Uploader \[(?P<uploader>[^\]]*)\] Tags \[(?P<tags>[^\]]*)\] Url \[(?P<baseUrl>https:\/\/[^\/]+\/)torrents\.php\?torrentid=(?P<torrentId>\d+)\]$'
            tests:
              - line: 'Name: [Studio] Example Scene Title - Performer One, Performer Two [FHD] Freeleech [No] Size [4.75 GiB] Uploader [example_uploader] Tags [pron, performer.one, performer.two, studio.name] Url [https://www.happyfappy.net/torrents.php?torrentid=12345]'
                expect:
                  releaseName: '[Studio] Example Scene Title - Performer One, Performer Two [FHD]'
                  freeleech: "No"
                  torrentSize: 4.75 GiB
                  uploader: example_uploader
                  tags: pron, performer.one, performer.two, studio.name
                  baseUrl: https://www.happyfappy.net/
                  torrentId: "12345"

              - line: 'Name: [Studio] Example Scene Title - Performer One [2160p] Freeleech [Yes] Size [8.25 GiB] Uploader [Anonymous] Tags [pron, performer.one] Url [https://www.happyfappy.net/torrents.php?torrentid=12346]'
                expect:
                  releaseName: '[Studio] Example Scene Title - Performer One [2160p]'
                  freeleech: "Yes"
                  torrentSize: 8.25 GiB
                  uploader: Anonymous
                  tags: pron, performer.one
                  baseUrl: https://www.happyfappy.net/
                  torrentId: "12346"

              - line: 'Name: [Studio] Example Scene [Part 2] [FHD] Freeleech [No] Size [512 MiB] Uploader [Anonymous] Tags [] Url [https://www.happyfappy.net/torrents.php?torrentid=12347]'
                expect:
                  releaseName: '[Studio] Example Scene [Part 2] [FHD]'
                  freeleech: "No"
                  torrentSize: 512 MiB
                  uploader: Anonymous
                  tags: ""
                  baseUrl: https://www.happyfappy.net/
                  torrentId: "12347"

        match:
          infourl: "/torrents.php?torrentid={{ .torrentId }}"
          downloadurl: "/torrents.php?action=download&id={{ .torrentId }}&authkey={{ .authkey }}&torrent_pass={{ .torrent_pass }}"
