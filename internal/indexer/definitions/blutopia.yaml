---
version: 2
name: Blutopia
identifier: blutopia
implementation: matrix
description: Blutopia (BLU) is a private tracker for HD movies and TV.
language: en-us
urls:
  - https://blutopia.cc/
privacy: private
protocol: torrent
supports:
  - matrix
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key (RID)
    help: "Go to your profile tab, Settings > Security, copy RSS Key (RID)"

matrix:
  network: Watchtower
  homeserver: https://matrix.watchtower.pm
  rooms:
    - name: "#blu-announce:matrix.watchtower.pm"
      announcers:
        - "@blubot:matrix.watchtower.pm"
      parse:
        type: single
        lines:
          - pattern: '^\[Blutopia\] \[NEW\] (?P<uploader>.+?) has uploaded (?P<releaseName>.+?) grab it now! \[Category: (?P<category>[^\]]+)\] \[Type: (?P<releaseTags>[^\]]+)\] \[Size: (?P<torrentSize>[^\]]+)\] \[Freeleech: (?P<freeleechPercent>\d+%)\] \[DoubleUpload: [^\]]+\] \[Internal: (?P<internal>[^\]]+)\] \[PersonalRelease: [^\]]+\](?: \[TMDB: \d+\])?(?: \[IMDB: (?P<imdb>\d+)\])?.*\[Link: (?P<baseUrl>https?://.+/)torrents/(?P<torrentId>\d+)\]'
            tests:
              - line: '[Blutopia] [NEW] An anonymous user has uploaded Tenzing 2026 1080p ATVP WEB-DL DD+ 5.1 H.264-NTb grab it now! [Category: Movie] [Type: WEB-DL] [Size: 9.4 GiB] [Freeleech: 0%] [DoubleUpload: No] [Internal: No] [PersonalRelease: No] [TMDB: 1288069] [IMDB: 6262770] [TMDB vote average: 6.2] [TMDB vote count: 4] [Link: https://blutopia.cc/torrents/402585]'
                expect:
                  uploader: An anonymous user
                  releaseName: Tenzing 2026 1080p ATVP WEB-DL DD+ 5.1 H.264-NTb
                  category: Movie
                  releaseTags: WEB-DL
                  torrentSize: 9.4 GiB
                  freeleechPercent: 0%
                  internal: "No"
                  imdb: "6262770"
                  baseUrl: https://blutopia.cc/
                  torrentId: "402585"

              - line: '[Blutopia] [NEW] bearfish has uploaded True Story with Hamish & Andy S02 1080p STAN WEB-DL AAC 2.0 H.265-NYXIS grab it now! [Category: TV Show] [Type: WEB-DL] [Size: 4.75 GiB] [Freeleech: 0%] [DoubleUpload: No] [Internal: No] [PersonalRelease: Yes] [TMDB: 72242] [IMDB: 6974706] [TMDB vote average: 8.5] [TMDB vote count: 2] [Link: https://blutopia.cc/torrents/402579]'
                expect:
                  uploader: bearfish
                  releaseName: True Story with Hamish & Andy S02 1080p STAN WEB-DL AAC 2.0 H.265-NYXIS
                  category: TV Show
                  releaseTags: WEB-DL
                  torrentSize: 4.75 GiB
                  freeleechPercent: 0%
                  internal: "No"
                  imdb: "6974706"
                  baseUrl: https://blutopia.cc/
                  torrentId: "402579"

              - line: '[Blutopia] [NEW] BoTN has uploaded Rage (Furia) AKA Furia 2025 S02E04 1080p AMZN WEB-DL Dual-Audio DD+ 5.1 H.264-RAWR grab it now! [Category: TV Show] [Type: WEB-DL] [Size: 2.34 GiB] [Freeleech: 100%] [DoubleUpload: No] [Internal: No] [PersonalRelease: No] [TMDB: 280880] [IMDB: 32327588] [TMDB vote average: 6.554] [TMDB vote count: 28] [Link: https://blutopia.cc/torrents/409833]'
                expect:
                  uploader: BoTN
                  releaseName: Rage (Furia) AKA Furia 2025 S02E04 1080p AMZN WEB-DL Dual-Audio DD+ 5.1 H.264-RAWR
                  category: TV Show
                  releaseTags: WEB-DL
                  torrentSize: 2.34 GiB
                  freeleechPercent: 100%
                  internal: "No"
                  imdb: "32327588"
                  baseUrl: https://blutopia.cc/
                  torrentId: "409833"

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
