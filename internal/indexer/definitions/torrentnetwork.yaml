---
version: 2
#id: torrentnetwork
name: TorrentNetwork
identifier: torrentnetwork
description: Torrent Network (TN) is a GERMAN Private site for TV / MOVIES / GENERAL
language: de-DE
urls:
  - https://tntracker.org/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: unknown
settings:
  - name: passkey
    type: secret
    required: true
    label: PassKey
    help: "Home -> RSS -> Extract PassKey from URL"

irc:
  network: TorrentNetwork
  server: irc.tntracker.org
  port: 19436
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user|bot

    - name: auth.account
      type: text
      required: true
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: true
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#announce"
      announcers:
        - "|TN|"
      parse:
        type: multi
        lines:
          - pattern: '\{New Torrent\} Name \{(?P<releaseName>.*)\} Typ \{(?P<category>.+?)\}(?: Pre \{(?P<preTime>.*)\})?'
            tests:
              - line: '{New Torrent} Name {Luke_EP--Wildstyle_-_Sump_Ting-(RNR002)-WEB-2016-OMA} Typ {Music|MP3} Pre {14 s}'
                expect:
                  releaseName: Luke_EP--Wildstyle_-_Sump_Ting-(RNR002)-WEB-2016-OMA
                  category: Music|MP3
                  preTime: 14 s

          - pattern: '\{New Torrent\} Size \{(?P<torrentSize>.*)\} Files \{\d+\} Link \{(?P<baseUrl>https?:\/\/[^\/]+\/)torrent\/(?P<torrentId>\d+)\}'
            tests:
              - line: '{New Torrent} Size {24.629 MiB} Files {5} Link {https://tntracker.org/torrent/000000}'
                expect:
                  torrentSize: 24.629 MiB
                  baseUrl: https://tntracker.org/
                  torrentId: "000000"

        match:
          infourl: "/torrent/{{ .torrentId }}"
          downloadurl: "/download/{{ .torrentId }}/{{ .passkey }}"
