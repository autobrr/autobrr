---
version: 2
#id: torrenthr
name: TorrentHR
identifier: thr
description: TorrentHR (THR) is private croatian tracker
language: hr
urls:
  - https://www.torrenthr.org/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key (RID)
    help: "Go to your profile, General > RSS key, and copy the RSS Key (RID)"

irc:
  network: THR
  server: irc.torrenthr.org
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_autodl

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account.  Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

    - name: invite_command
      type: secret
      default: "THR key IRCKEY"
      required: true
      label: Invite command
      help: Invite auth with THR. Replace IRCKEY.

  channels:
    - name: "#announce"
      announcers:
        - THR
      parse:
        type: single
        lines:
          - pattern: '^\[.*?\]\s+~THR Novi torrent -> Ime: (?P<releaseName>.*?) \.:\. Uploader: (?P<uploader>.*?) \.:\. Kategorija: (?P<category>.*?) \.:\. Velicina: (?P<torrentSize>.*?) \.:\. URL: (?P<baseUrl>https?:\/\/.+\/)torrents\/(?P<torrentId>\d+)'
            tests:
              - line: '[2026-07-29 16:48:14] ~THR Novi torrent -> Ime: A.torrent.name.here.WEBRip.x264-tina .:. Uploader: uploaderName .:. Kategorija: Filmovi/HD .:. Velicina: 6.70 GB .:. URL: https://www.torrenthr.org/torrents/000000'
                expect:
                  releaseName: A.torrent.name.here.WEBRip.x264-tina
                  uploader: uploaderName
                  category: Filmovi/HD
                  torrentSize: 6.70 GB
                  baseUrl: https://www.torrenthr.org/
                  torrentId: "000000"

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
