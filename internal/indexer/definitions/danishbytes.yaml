---
version: 2
#id: danishbytes
name: DanishBytes
identifier: danishbytes
description: DanishBytes is a private torrent tracker for HD MOVIES / TV
language: en-us
urls:
  - https://danishbytes.club/
  - https://danishbytes2.org/
  - https://dbytes.org/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: passkey
    type: secret
    required: true
    label: RSS key
    help: "Go to your profile tab under safety, copy RSS Key (RID)"

irc:
  network: DanishBytes
  server: irc.danishbytes.club
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#Announce"
      announcers:
        - DBBot
      parse:
        type: single
        lines:
          - pattern: ':\[N\]-\[(?P<category>.*)\]-\[(?P<releaseTags>.*)\]-\[(?P<resolution>.*)\]-\[(?P<torrentSize>.*)\]-\[(?P<releaseName>.*)\]-\[(?P<uploader>.*)\]-\[(?P<baseUrl>.*\/)(?:.*\/)(?P<torrentId>.*)\]-\[FL: (?P<freeleech>.*)\]-\[DU: .*\];'
            tests:
              - line: ':[N]-[Movies]-[Encode]-[720p]-[797 MiB]-[Some.Old.Movie.1972.720p.BluRay.x264.AAC-GROUP]-[Anonymous]-[https://danishbytes.club/torrents/0000]-[FL: 0]-[DU: 0];'
                expect:
                  category: Movies
                  releaseTags: Encode
                  resolution: 720p
                  torrentSize: 797 MiB
                  releaseName: Some.Old.Movie.1972.720p.BluRay.x264.AAC-GROUP
                  uploader: Anonymous
                  baseUrl: https://danishbytes.club/
                  torrentId: "0000"
                  freeleech: "0"

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .passkey }}"
