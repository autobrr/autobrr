---
version: 2
#id: itatorrents
name: ItaTorrents
identifier: itatorrents
description: ItaTorrents (ITT) is an ITALIAN private torrent tracker for MOVIES / TV / GENERAL
language: it-IT
urls:
  - https://itatorrents.xyz/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Go to your profile tab, Settings > RSS Keys, copy RSS Key"

irc:
  network: ItaTorrents
  server: irc.itatorrents.xyz
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: true
      label: NickServ Account
      help: NickServ account. Register with the same username and email as your site account.

    - name: auth.password
      type: secret
      required: true
      label: NickServ Password
      help: NickServ password. New accounts must be validated by an administrator.

  channels:
    - name: "#Announce"
      announcers:
        - ITTBot
      parse:
        type: single
        lines:
          # <announceType>:<category>:<leechType>:<origin>:<tid>:<sizebytes>:<uploadDate>:<tmdbid>|<Type>/<resolution>|<year>|<releasename>|<uploader>
          - pattern: '(?P<announceTypeEnum>\d):(?P<categoryEnum>\d+):(?P<leechTypeEnum>\d):(?P<originEnum>\d):(?P<torrentId>\d+):(?P<torrentSizeBytes>\d+):(?P<uploadedDate>\d+):(?P<tmdb>\d+)\|(?P<releaseTags>.*)\|(?P<year>\d+)?\|(?P<releaseName>.+)\|(?P<uploader>.+)'
            tests:
              - line: 0:1:0:0:69965:5381449228:1790103021:1240889|WEB-DL/1080p|2026|Camp Miasma Adolescenza, Sesso E Morte 2026 1080p FullHD WEB-DL DD+ 2.0 DD 2.0 ITA ENG SUBS SDR H.265-TheEmojiCrew|SeedBox
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 1
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "69965"
                  torrentSizeBytes: "5381449228"
                  uploadedDate: "1790103021"
                  tmdb: "1240889"
                  releaseTags: WEB-DL/1080p
                  year: "2026"
                  releaseName: Camp Miasma Adolescenza, Sesso E Morte 2026 1080p FullHD WEB-DL DD+ 2.0 DD 2.0 ITA ENG SUBS SDR H.265-TheEmojiCrew
                  uploader: SeedBox

              - line: 0:2:0:0:69966:2046719372:1790103446:238839|WEB-DL/1080p|2019|Matrimonio a prima vista Italia S14E05 1080p FullHD WEB-DL DD+ 2.0 ITA SDR H.264|SeedBox
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 2
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "69966"
                  torrentSizeBytes: "2046719372"
                  uploadedDate: "1790103446"
                  tmdb: "238839"
                  releaseTags: WEB-DL/1080p
                  year: "2019"
                  releaseName: Matrimonio a prima vista Italia S14E05 1080p FullHD WEB-DL DD+ 2.0 ITA SDR H.264
                  uploader: SeedBox

              - line: "0:1:0:0:69967:1505672736:1790104218:15999|WEBRip/1080p|2001|Vampire Hunter D: Bloodlust 2001 1080p FullHD WEBRip AAC 2.0 ITA SDR H.264|Uploader"
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 1
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "69967"
                  torrentSizeBytes: "1505672736"
                  uploadedDate: "1790104218"
                  tmdb: "15999"
                  releaseTags: WEBRip/1080p
                  year: "2001"
                  releaseName: "Vampire Hunter D: Bloodlust 2001 1080p FullHD WEBRip AAC 2.0 ITA SDR H.264"
                  uploader: Uploader

        mappings:
          announceTypeEnum:
            "0":
              announceType: NEW
            "1":
              announceType: PROMO
            "2":
              announceType: RESURRECTED

          categoryEnum:
            "1":
              category: "Movies"
            "2":
              category: "TV"
            "3":
              category: "Music"
            "4":
              category: "Games"
            "5":
              category: "Apps"
            "6":
              category: "Magazines"
            "7":
              category: "E-Book"
            "8":
              category: "Audiobooks"
            "12":
              category: "Courses"
            "13":
              category: "Comics"
            "14":
              category: "Concerts"
            "15":
              category: "Discography"

          originEnum:
            "0":
              origin: ""
            "1":
              origin: "INTERNAL"
            "2":
              origin: "INTERNAL" # PERSONAL RIP

          leechTypeEnum:
            "0": # Normal
              downloadVolumeFactor: 1
              uploadVolumeFactor: 1
            "1": # 100% FL
              downloadVolumeFactor: 0
              uploadVolumeFactor: 1
            "2": # 75% FL
              downloadVolumeFactor: 0.25
              uploadVolumeFactor: 1
            "3": # 50% FL
              downloadVolumeFactor: 0.5
              uploadVolumeFactor: 1
            "4": # 25% FL
              downloadVolumeFactor: 0.75
              uploadVolumeFactor: 1
            "5": # Normal leech with Double up
              downloadVolumeFactor: 1
              uploadVolumeFactor: 2
            "6": # 100% FL with Double up
              downloadVolumeFactor: 0
              uploadVolumeFactor: 2
            "7": # 75% FL with Double up
              downloadVolumeFactor: 0.25
              uploadVolumeFactor: 2
            "8": # 50% FL with Double up
              downloadVolumeFactor: 0.5
              uploadVolumeFactor: 2
            "9": # 25% FL with Double up
              downloadVolumeFactor: 0.75
              uploadVolumeFactor: 2

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
