---
version: 2
#id: infinityhd
name: InfinityHD
identifier: infinityhd
description: InfinityHD is a private torrent tracker for MOVIES, TV, and MUSIC
language: en-us
urls:
  - https://infinityhd.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Go to My Settings > Settings -> RSS Key, and copy your RSS Key"

irc:
  network: InfinityHD
  server: irc.infinityhd.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user|bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#announce"
      announcers:
        - cosmo
      parse:
        type: single
        lines:
          # <announceType>:<category>:<leechType>:<origin>:<tid>:<sizebytes>:<uploadDate>:<tmdbid>|<Type>/<resolution>|<year>|<releasename>|<uploader>
          # music: <announceType>:5:<leechType>:<origin>:<tid>:<sizebytes>:<uploadDate>:0|<format>/<tags>|<year>|<releasename>|<uploader>
          - pattern: '(?P<announceTypeEnum>\d):(?P<categoryEnum>\d):(?P<leechTypeEnum>\d):(?P<originEnum>\d):(?P<torrentId>\d+):(?P<torrentSizeBytes>\d+):(?P<uploadedDate>\d+):(?P<tmdb>\d+)\|(?P<releaseTags>.*)\|(?P<year>\d+)?\|(?P<releaseName>.+)\|(?P<uploader>.+)'
            tests:
              - line: 0:2:0:0:12878:9939320728:1774760500:203489|WEB-DL/1080p|2022|Mike Judge's Beavis and Butt-Head S02 1080p AMZN WEB-DL DD+ 5.1 H.264-NTb|uploader1
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 2
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "12878"
                  torrentSizeBytes: "9939320728"
                  uploadedDate: "1774760500"
                  tmdb: "203489"
                  releaseTags: WEB-DL/1080p
                  year: "2022"
                  releaseName: Mike Judge's Beavis and Butt-Head S02 1080p AMZN WEB-DL DD+ 5.1 H.264-NTb
                  uploader: uploader1

              - line: 0:3:1:0:12880:18962924195:1774757803:213830|Encode/1080p|2024|I Was Reincarnated as the 7th Prince so I Can Take My Time Perfecting My Magical Ability AKA Tensei Shitara Dainana Ouji Datta Node, Kimama ni Majutsu wo Kiwamemasu S01 PROPER 1080p BluRay Dual-Audio Opus 2.0 x265-Headpatter|uploader2
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 3
                  leechTypeEnum: 1
                  originEnum: 0
                  torrentId: "12880"
                  torrentSizeBytes: "18962924195"
                  uploadedDate: "1774757803"
                  tmdb: "213830"
                  releaseTags: Encode/1080p
                  year: "2024"
                  releaseName: I Was Reincarnated as the 7th Prince so I Can Take My Time Perfecting My Magical Ability AKA Tensei Shitara Dainana Ouji Datta Node, Kimama ni Majutsu wo Kiwamemasu S01 PROPER 1080p BluRay Dual-Audio Opus 2.0 x265-Headpatter
                  uploader: uploader2

              - line: 0:5:1:1:25704:344064512:1775190000:0|FLAC/Lossless / WEB|2014|Headhunterz featuring Krewella - United Kids of the World (Remixes) (2014) [WEB FLAC]-StellarRift|uploader3
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 5
                  leechTypeEnum: 1
                  originEnum: 1
                  torrentId: "25704"
                  torrentSizeBytes: "344064512"
                  uploadedDate: "1775190000"
                  tmdb: "0"
                  releaseTags: FLAC/Lossless / WEB
                  year: "2014"
                  releaseName: Headhunterz featuring Krewella - United Kids of the World (Remixes) (2014) [WEB FLAC]-StellarRift
                  uploader: uploader3

              - line: 0:5:0:0:25910:472908011:1775193600:0|FLAC/Lossless / CD / Log / 100% / Cue|1997|Radiohead - OK Computer (1997) [CD FLAC]-GROUP|uploader4
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 5
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "25910"
                  torrentSizeBytes: "472908011"
                  uploadedDate: "1775193600"
                  tmdb: "0"
                  releaseTags: FLAC/Lossless / CD / Log / 100% / Cue
                  year: "1997"
                  releaseName: Radiohead - OK Computer (1997) [CD FLAC]-GROUP
                  uploader: uploader4

        mappings:
          announceTypeEnum:
            "0":
              announceType: NEW
            "1":
              announceType: PROMO
            "2":
              announceType: RESURRECTED

          categoryEnum:
            "1":
              category: "Movies"
            "2":
              category: "TV"
            "3":
              category: "Anime"
            "4":
              category: "Anime Movie"
            "5":
              category: "Music"

          originEnum:
            "0":
              origin: ""
            "1":
              origin: "INTERNAL"
            "2":
              origin: "INTERNAL" # PERSONAL RIP

          leechTypeEnum:
            "0": # Normal
              downloadVolumeFactor: 1
              uploadVolumeFactor: 1
            "1": # 100% FL
              downloadVolumeFactor: 0
              uploadVolumeFactor: 1
            "2": # 75% FL
              downloadVolumeFactor: 0.25
              uploadVolumeFactor: 1
            "3": # 50% FL
              downloadVolumeFactor: 0.5
              uploadVolumeFactor: 1
            "4": # 25% FL
              downloadVolumeFactor: 0.75
              uploadVolumeFactor: 1
            "5": # Normal leech with Double up
              downloadVolumeFactor: 1
              uploadVolumeFactor: 2
            "6": # 100% FL with Double up
              downloadVolumeFactor: 0
              uploadVolumeFactor: 2
            "7": # 75% FL with Double up
              downloadVolumeFactor: 0.25
              uploadVolumeFactor: 2
            "8": # 50% FL with Double up
              downloadVolumeFactor: 0.5
              uploadVolumeFactor: 2
            "9": # 25% FL with Double up
              downloadVolumeFactor: 0.75
              uploadVolumeFactor: 2

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
