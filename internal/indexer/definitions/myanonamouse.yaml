                  torrentId: "1262654"
                  releaseTags: VIP

              - line: 'The Long Game: A Playbook of the World''s Most Enduring Companies By: Eric Becker [English] [Audiobook] [Non-Fiction] [m4b] [132.69 MiB] - Business/Money - https://www.myanonamouse.net/t/1262674 Normal'
                expect:
                  releaseName: 'The Long Game: A Playbook of the World''s Most Enduring Companies By: Eric Becker [English] [Audiobook] [Non-Fiction] [m4b]'
                  title: 'The Long Game: A Playbook of the World''s Most Enduring Companies'
                  author: Eric Becker
                  language: English
                  category: Audiobook
                  subCategory: Non-Fiction
                  container: m4b
                  torrentSize: 132.69 MiB
                  tags: Business/Money
                  baseUrl: https://www.myanonamouse.net/
                  torrentId: "1262674"
                  releaseTags: Normal

              - line: 'El bestiario de Axlin By: Laura Gallego [Spanish] [Ebook] [Fiction] [epub] [1.26 MiB] - Fantasy,  Young Adult - https://www.myanonamouse.net/t/1262675 Normal'
                expect:
                  releaseName: 'El bestiario de Axlin By: Laura Gallego [Spanish] [Ebook] [Fiction] [epub]'
                  title: El bestiario de Axlin
                  author: Laura Gallego
                  language: Spanish
                  category: Ebook
                  subCategory: Fiction
                  container: epub
                  torrentSize: 1.26 MiB
                  tags: 'Fantasy,  Young Adult'
