---
version: 2
#id: tracker01
name: MyAnonamouse
identifier: myanonamouse
description: MyAnonaMouse (MAM) is a large ebook and audiobook tracker.
language: en-us
urls:
  - https://www.myanonamouse.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: custom
settings:
  - name: cookie
    type: secret
    required: true
    label: Cookie (mam_id)
    help: "Under your username, go to preferences then security and generate a session using the IP address Autobrr runs on. Changes monthly. Format mam_id=$ID;"

irc:
  network: MyAnonamouse
  server: irc.myanonamouse.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: true
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot. Use main nick here.

    - name: auth.password
      type: secret
      required: true
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#announce"
      announcers:
        - MouseBot
      parse:
        type: single
        lines:
          - pattern: '(?P<releaseName>.*?(?P<title>.+?) By: (?P<author>.+?) \[(?P<language>[^\]]+)\] \[(?P<category>[^\]]+)\] \[(?P<subCategory>[^\]]+)\] \[(?P<container>[^\]]+)\]) \[(?P<torrentSize>[^\]]+)\] - (?P<tags>.+) - (?P<baseUrl>https?\:\/\/[^\/]+\/)t\/(?P<torrentId>\d+)\s*(?P<releaseTags>VIP|Normal)?'
            tests:
              - line: 'Frost Hunger By: Indigo Frey [English] [Ebook] [Fiction] [epub] [1.07 MiB] - Fantasy, LGBTQIA+, Erotica/Sexual Content, Romance - https://www.myanonamouse.net/t/1262654 VIP'
                expect:
                  releaseName: 'Frost Hunger By: Indigo Frey [English] [Ebook] [Fiction] [epub]'
                  title: Frost Hunger
                  author: Indigo Frey
                  language: English
                  category: Ebook
