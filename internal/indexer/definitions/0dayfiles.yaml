---
version: 2
#id: 0dayfiles
name: 0DayFiles
identifier: 0dayfiles
description: 0DayFiles (0DF) is a private torrent tracker for 0DAY / GENERAL
language: en-us
urls:
  - https://0dayfiles.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Go to My Settings > Settings -> RSS Key, and copy your RSS Key"

irc:
  network: P2P-Network
  server: irc.p2p-network.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_autobrr

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

    - name: channels.password
      type: secret
      required: true
      label: Channel Password
      help: "Channel password for #0dayfiles-announce. Find it on the site IRC page"

  channels:
    - name: "#0dayfiles-announce"
      announcers:
        - ODF-Announce
      parse:
        type: single
        lines:
          # <announceType>:<category>:<leechType>:<origin>:<tid>:<sizebytes>:<uploadDate>:<tmdbid>|<Type>/<resolution>|<year>|<releasename>|<uploader>
          - pattern: '(?P<announceTypeEnum>\d):(?P<categoryEnum>\d+):(?P<leechTypeEnum>\d):(?P<originEnum>\d):(?P<torrentId>\d+):(?P<torrentSizeBytes>\d+):(?P<uploadedDate>\d+):(?P<tmdb>\d+)\|[^|]*\|(?P<year>\d+)?\|(?P<releaseName>.+)\|(?P<uploader>.+)'
            tests:
              - line: 0:18:0:0:24057:9651776483:1791208490:752|/|2006|V For Vendetta 2006 1080p AMZN WEB-DL DD+ 5.1 H.264-BLOOM|susumo
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 18
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "24057"
                  torrentSizeBytes: "9651776483"
                  uploadedDate: "1791208490"
                  tmdb: "752"
                  year: "2006"
                  releaseName: V For Vendetta 2006 1080p AMZN WEB-DL DD+ 5.1 H.264-BLOOM
                  uploader: susumo

              - line: 0:59:1:0:24063:1208760320:1791210252:1265|/|2000|Some.Show.S75E14.720p.WEB-DL.AAC2.0.H.264-GROUP|Uploader
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 59
                  leechTypeEnum: 1
                  originEnum: 0
                  torrentId: "24063"
                  torrentSizeBytes: "1208760320"
                  uploadedDate: "1791210252"
                  tmdb: "1265"
                  year: "2000"
                  releaseName: Some.Show.S75E14.720p.WEB-DL.AAC2.0.H.264-GROUP
                  uploader: Uploader

              - line: 0:58:8:1:24070:4521984000:1791214000:550|/|1999|Some.Movie.1999.1080p.WEB-DL.DDP5.1.H.264-GROUP|someuser
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 58
                  leechTypeEnum: 8
                  originEnum: 1
                  torrentId: "24070"
                  torrentSizeBytes: "4521984000"
                  uploadedDate: "1791214000"
                  tmdb: "550"
                  year: "1999"
                  releaseName: Some.Movie.1999.1080p.WEB-DL.DDP5.1.H.264-GROUP
                  uploader: someuser

              - line: 0:1:0:0:24071:734003200:1791215000:0|/||Some.Software.v2.1.Multilingual-GROUP|Anonymous
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 1
                  leechTypeEnum: 0
                  originEnum: 0
                  torrentId: "24071"
                  torrentSizeBytes: "734003200"
                  uploadedDate: "1791215000"
                  tmdb: "0"
                  year: ""
                  releaseName: Some.Software.v2.1.Multilingual-GROUP
                  uploader: Anonymous

              - line: 0:46:0:2:24072:15728640:1791216000:0|/||Some.Author.Some.Book.2026.EPUB-GROUP|someuser
                expect:
                  announceTypeEnum: 0
                  categoryEnum: 46
                  leechTypeEnum: 0
                  originEnum: 2
                  torrentId: "24072"
                  torrentSizeBytes: "15728640"
                  uploadedDate: "1791216000"
                  tmdb: "0"
                  year: ""
                  releaseName: Some.Author.Some.Book.2026.EPUB-GROUP
                  uploader: someuser

        mappings:
          announceTypeEnum:
            "0":
              announceType: NEW
            "1":
