---
version: 2
#id: nordicquality
name: NordicQuality
identifier: nordicquality
description: NordicQuality is a private torrent tracker for HD MOVIES / TV
language: en-us
urls:
  - https://nordicq.org
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Go to your profile and under Settings > Security, copy your RSS Key (RID)"

irc:
  network: P2P-Network
  server: irc.p2p-network.net
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#nordicquality"
      announcers:
        - NordicQuality
      parse:
        type: single
        lines:
          - pattern: '\[ (?P<announceTypeEnum>.+?) \]\[ (?P<category>.+?) \]\[ (?P<releaseTags>.+?) \]\[ (?P<releaseName>.+?) \]\[ (?P<torrentSize>.+?) \]\[ (?P<baseUrl>https?:\/\/.+?\/)torrents\/(?P<torrentId>\d+) \]\[ FL: (?P<freeleechPercent>\d+) % \]\[ DU: \d+ \]\[ iMDB: (?P<imdb>\d+) \]\[ TMDB: (?P<tmdb>\d+) \]\[ TVDB: (?P<tvdb>\d+) \]\[ iGDB: (?P<igdb>\d+) \]'
            tests:
              - line: '[ NEW ][ Movies ][ REMUX ][ That.Movie.1982.BluRay.1080p.DTS-HD.MA.5.1.AVC.REMUX-GROUP ][ 23.35 GiB ][ https://nordicq.org/torrents/0000 ][ FL: 100 % ][ DU: 0 ][ iMDB: 84827 ][ TMDB: 97 ][ TVDB: 0 ][ iGDB: 0 ]'
                expect:
                  announceTypeEnum: NEW
                  category: Movies
                  releaseTags: REMUX
                  releaseName: That.Movie.1982.BluRay.1080p.DTS-HD.MA.5.1.AVC.REMUX-GROUP
                  torrentSize: 23.35 GiB
                  baseUrl: https://nordicq.org/
                  torrentId: "0000"
                  freeleechPercent: "100"
                  imdb: "84827"
                  tmdb: "97"
                  tvdb: "0"
                  igdb: "0"
              - line: '[ NEW ][ TV ][ WEB-DL ][ Some.Show.S02E08.SWEDiSH.1080p.WEB-DL.DD5.1.H.264-GROUP ][ 1.45 GiB ][ https://nordicq.org/torrents/0000 ][ FL: 100 % ][ DU: 0 ][ iMDB: 38545732 ][ TMDB: 299054 ][ TVDB: 468034 ][ iGDB: 0 ]'
                expect:
                  announceTypeEnum: NEW
                  category: TV
                  releaseTags: WEB-DL
                  releaseName: Some.Show.S02E08.SWEDiSH.1080p.WEB-DL.DD5.1.H.264-GROUP
                  torrentSize: 1.45 GiB
                  baseUrl: https://nordicq.org/
                  torrentId: "0000"
                  freeleechPercent: "100"
                  imdb: "38545732"
                  tmdb: "299054"
                  tvdb: "468034"
                  igdb: "0"
              - line: '[ NEW ][ Games ][ Console ][ Some.Game.Special.Edition.DLC.NSW-GROUP ][ 129.44 KiB ][ https://nordicq.org/torrents/0000 ][ FL: 0 % ][ DU: 0 ][ iMDB: 0 ][ TMDB: 0 ][ TVDB: 0 ][ iGDB: 403731 ]'
                expect:
                  announceTypeEnum: NEW
                  category: Games
                  releaseTags: Console
                  releaseName: Some.Game.Special.Edition.DLC.NSW-GROUP
                  torrentSize: 129.44 KiB
                  baseUrl: https://nordicq.org/
                  torrentId: "0000"
                  freeleechPercent: "0"
                  imdb: "0"
                  tmdb: "0"
                  tvdb: "0"
                  igdb: "403731"
              - line: '[ DYiNG ][ TV ][ WEB-DL ][ Some.Show.S03E03.NORDiC.1080p.WEB-DL.DDP5.1.H.264-GROUP ][ 1.15 GiB ][ https://nordicq.org/torrents/0000 ][ FL: 100 % ][ DU: 1 ][ iMDB: 31589662 ][ TMDB: 243875 ][ TVDB: 448023 ][ iGDB: 0 ]'
                expect:
                  announceTypeEnum: DYiNG
                  category: TV
                  releaseTags: WEB-DL
                  releaseName: Some.Show.S03E03.NORDiC.1080p.WEB-DL.DDP5.1.H.264-GROUP
                  torrentSize: 1.15 GiB
                  baseUrl: https://nordicq.org/
                  torrentId: "0000"
                  freeleechPercent: "100"
                  imdb: "31589662"
                  tmdb: "243875"
                  tvdb: "448023"
                  igdb: "0"

        mappings:
          announceTypeEnum:
            "NEW":
              announceType: NEW
            "DYiNG": # re-announced with freeleech and double upload to get more seeds
              announceType: PROMO

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
