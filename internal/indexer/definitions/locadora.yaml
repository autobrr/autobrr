---
version: 2
#id: Locadora 
name: Locadora
identifier: locadora
description: Locadora is a Brazilian tracker for Movies, TV Shows and Animes.
language: pt-BR
urls:
  - https://locadora.cc/
privacy: private
protocol: torrent
supports:
  - irc
    #  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key (RID)
    help: "Go to your profile tab, Settings > Security, copy RSS Key (RID)"

irc:
  network: locadora.cc
  server: irc.locadora.cc
  port: 6667
  tls: false
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot
      
    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#announce"
      announcers:
        - LCD
      parse:
        type: single
        lines:
          - tests:
            - line: '[Filmes] [WEB-DL] [1080p] [Paul 2011 1080p AMZN WEB-DL DDP5.1 H.264 pt-BR ENG-LCD / Portuguese (BR) English (US)] [https://locadora.cc/torrents/28808] [7.61 GiB] [100%] [Internal:1] [tmdb-39513]'
              expect:
                category: Filmes
                releaseTags: WEB-DL
                resolution: 1080p
                releaseName: Paul 2011 1080p AMZN WEB-DL DDP5.1 H.264 pt-BR ENG-LCD / Portuguese (BR) English (US)
                baseUrl: https://locadora.cc/
                torrentId: "28808"
                torrentSize: 7.61 GiB
                freeleechPercent: 100%
                internal: "1"
                tags: "39513"
            pattern: '\[(.+)\] \[(.+)\] \[(.+)\] \[(.+?)\] \[(https?\:\/\/.+\/).+\/(\d+)\] \[(.+?)\] \[(.+?)\] \[Internal:(\d)\] \[[a-z]+-(\d+)\]'
            vars:
              - category
              - releaseTags
              - resolution
              - releaseName
              - baseUrl
              - torrentId
              - torrentSize
              - freeleechPercent
              - internal
              - tags

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
