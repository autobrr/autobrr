---
version: 2
#id: gazellegames
name: GazelleGames
identifier: ggn
description: GazelleGames (GGn) is a private torrent tracker for GAMES
language: en-us
urls:
  - https://gazellegames.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
  - api
# source: gazelle
settings:
  - name: authkey
    type: secret
    required: true
    label: Auth key
    help: Right click DL on a torrent and get the authkey.

  - name: torrent_pass
    type: secret
    required: true
    label: Torrent pass
    help: Right click DL on a torrent and get the torrent_pass.

  - name: api_key
    type: secret
    required: true
    label: API Key
    help: Username -> Edit / Settings -> API Keys

# api:
#   url: https://gazellegames.net/api.php
#   type: json
#   limits:
#     max: 5
#     per: 10 seconds
#   settings:
#     - name: api_key
#       type: secret
#       label: API Key
#       help: Username -> Edit / Settings -> API Keys

irc:
  network: GGn
  server: irc.gazellegames.net
  port: 7000
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user|bot

    - name: auth.account
      type: text
      required: true
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: true
      label: NickServ Password
      help: NickServ password

    - name: invite_command
      type: secret
      default: "Vertigo ENTER #GGn-Announce USERNAME IRCKEY"
      required: true
      label: Invite command
      help: Invite auth with Vertigo. Replace USERNAME and IRCKEY.

  channels:
    - name: "#GGn-Announce"
      announcers:
        - Vertigo
      parse:
        type: single
        lines:
          - pattern: '^(?P<uploader>.+) :-: (?P<category>.+) :-: (?P<releaseName>.+) \[(?P<year>\d+)?\] ::(?P<releaseTags>.+?)?:: ?(?P<freeleech>.+?)?(?:! ::)? (?P<baseUrl>https?:\/\/[^\/]+\/)torrents.php\?torrentid=(?P<torrentId>\d+)(?: - )?(?P<tags>[a-zA-Z0-9, _\.]+)?;?(?:[ :]*(?:[NSFW]*)?[! :]*)?$'
            tests:
              - line: 'Uploader :-: Nintendo 3DS :-: Cool.Game.KOR.3DS-BigBlueBox in Cool Game [2013] ::Korean, Multi-Region, Scene:: https://gazellegames.net/torrents.php?torrentid=00000 - adventure, role_playing_game, nintendo;'
                expect:
                  uploader: Uploader
                  category: Nintendo 3DS
                  releaseName: Cool.Game.KOR.3DS-BigBlueBox in Cool Game
                  year: "2013"
                  releaseTags: Korean, Multi-Region, Scene
                  freeleech: ""
                  baseUrl: https://gazellegames.net/
                  torrentId: "00000"
                  tags: adventure, role_playing_game, nintendo

              - line: 'Uploader :-: Windows :-: Other.Game-HI2U in Other Game [2016] ::English, Scene:: FREELEECH! :: https://gazellegames.net/torrents.php?torrentid=00000 - action, adventure, casual, indie, role.playing.game;'
                expect:
                  uploader: Uploader
                  category: Windows
                  releaseName: Other.Game-HI2U in Other Game
                  year: "2016"
                  releaseTags: English, Scene
                  freeleech: FREELEECH
                  baseUrl: https://gazellegames.net/
                  torrentId: "00000"
                  tags: action, adventure, casual, indie, role.playing.game

        match:
          infourl: "/torrents.php?torrentid={{ .torrentId }}"
          downloadurl: "/torrents.php?action=download&id={{ .torrentId }}&authkey={{ .authkey }}&torrent_pass={{ .torrent_pass }}"
