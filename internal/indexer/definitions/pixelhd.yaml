---
version: 2
#id: pixelhd
name: PixelHD
identifier: pixelhd
description: PixelHD is a specialty movie site. Ratio free.
language: en-us
urls:
  - https://pixelhd.me/
privacy: private
protocol: torrent
supports:
  - irc
# source: gazelle
settings:
  - name: authkey
    type: secret
    required: true
    label: Auth key
    help: Your Authkey from your PixelHD profile or torrent download link.

  - name: torrent_pass
    type: secret
    required: true
    label: Torrent pass
    help: Your Passkey (torrent_pass) from your PixelHD profile.

irc:
  network: PixelHD
  server: irc.pixelhd.me
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user-autodl

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

    - name: invite_command
      type: secret
      default: "LiMEY_ !invite IRCKEY SITEUSERNAME"
      required: true
      label: Invite command
      help: Invite auth with LiMEY_. Replace IRCKEY and SITEUSERNAME.

  channels:
    - name: "#pixelhd-announce"
      announcers:
        - LiMEY_
      parse:
        type: single
        lines:
          - pattern: '^\[(?P<category>[^\]]+)\] (?P<releaseName>[^\s]+)(?: \[(?P<tags>[^\]]+)\])? - (?P<torrentSize>[0-9.]+\s+[KMGT]B) - (?P<baseUrl>https?:\/\/.*\/)torrents\.php\?id=(?P<groupId>\d+) - https?:\/\/.*\/torrents\.php\?action=download&id=(?P<torrentId>\d+)$'
            tests:
              - line: "[Movie] The.Matrix.1999.1080p.BluRay.x264-PxHD [action, sci-fi] - 4.37 GB - https://pixelhd.me/torrents.php?id=12345 - https://pixelhd.me/torrents.php?action=download&id=67890"
                expect:
                  category: Movie
                  releaseName: The.Matrix.1999.1080p.BluRay.x264-PxHD
                  tags: "action, sci-fi"
                  torrentSize: 4.37 GB
                  baseUrl: "https://pixelhd.me/"
                  groupId: "12345"
                  torrentId: "67890"

        match:
          infourl: "/torrents.php?id={{ .groupId }}"
          downloadurl: "/torrents.php?action=download&id={{ .torrentId }}&authkey={{ .authkey }}&torrent_pass={{ .torrent_pass }}"
