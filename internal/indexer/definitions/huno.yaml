---
version: 2
#id: huno
name: Hawke-UNO
identifier: huno
description: Hawke-UNO (HUNO) is a private torrent tracker for MOVIES / TV.
language: en-us
urls:
  - https://hawke.uno/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key (RID)
    help: "Go to your profile, My Security / RSS Key (RID) and copy your Current RID"

irc:
  network: Hawke-UNO
  server: irc.hawke.uno
  port: 6697
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Bot Nick
      help: Bot nick. Eg. username_bot

    - name: auth.account
      type: text
      required: true
      label: Username
      help: Must be your site username.

    - name: auth.password
      type: secret
      required: true
      label: IRC Key
      help: "Go to your profile, My Security / IRC Key (IID) and copy your Current IRC Key"

  channels:
    - name: "#huno_announce"
      announcers:
        - Luwin
      parse:
        type: single
        lines:
          - tests:
            - line: 'New in [Movie]: Old Movie (1981) (1080p BluRay x265 SDR DD 2.0 English - group1) [4.5 GiB] [FL: No] [INTERNAL: Yes] [https://hawke.uno/torrents/0000] by: [anon]'
              expect:
                category: Movie
                releaseName: Old Movie (1981) (1080p BluRay x265 SDR DD 2.0 English - group1)
                torrentSize: 4.5 GiB
                freeleech: "No"
                internal: "Yes"
                baseUrl: https://hawke.uno/
                torrentId: "0000"
                uploader: anon
            - line: 'New in [TV]: Popular show (2022) S01E09 (1080p DSNP WEB-DL x265 SDR DDP Atmos 5.1 English - GROUP)[REPACK] [955.97 MiB] [FL: Yes] [INTERNAL: Yes] [https://hawke.uno/torrents/0000] by: [uploader]'
              expect:
                category: TV
                releaseName: Popular show (2022) S01E09 (1080p DSNP WEB-DL x265 SDR DDP Atmos 5.1 English - GROUP)[REPACK]
                torrentSize: 955.97 MiB
                freeleech: "Yes"
                internal: "Yes"
                baseUrl: https://hawke.uno/
                torrentId: "0000"
                uploader: uploader
            pattern: 'New in \[(.+)\]: (.+)(?:\[(?:REPACK\d?|PROPER)\])? \[(.+)\] \[FL: (Yes|No)\] \[INTERNAL: (Yes|No)\] \[(https:\/\/.+\/)torrents\/(\d+)\] by: \[(.+)\]'
            vars:
              - category
              - releaseName
              - torrentSize
              - freeleech
              - internal
              - baseUrl
              - torrentId
              - uploader

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
