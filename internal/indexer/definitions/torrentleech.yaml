---
version: 2
#id: tracker01
name: TorrentLeech
identifier: torrentleech
description: TorrentLeech (TL) is a private torrent tracker for 0DAY / GENERAL.
language: en-us
urls:
  - https://www.torrentleech.org/
  - https://www.torrentleech.cc/
  - https://www.torrentleech.me/
  - https://www.tleechreload.org/
  - https://www.tlgetin.cc/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: custom
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Go to your profile and copy your RSS key"
    regex: /([\da-fA-F]{20})

irc:
  network: TorrentLeech.org
  server: irc.torrentleech.org
  port: 7021
  tls: true
  auth:
    mechanism: NICKSERV
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#tlannounces"
      announcers:
        - _AnnounceBot_
      parse:
        type: single
        lines:
          - pattern: New Torrent Announcement:\s*<(?P<category>[^>]*)>\s*Name:'(?P<releaseName>.*)' uploaded by '(?P<uploader>[^']*)'\s*(?P<freeleech>freeleech)*\s*-\s*(?P<baseUrl>https?\:\/\/[^\/]+\/)torrent\/(?P<torrentId>\d+)
            tests:
              - line: 'New Torrent Announcement: <PC :: Iso>  Name:''debian live 10 6 0 amd64 standard iso'' uploaded by ''Anonymous'' -  http://www.tracker01.test/torrent/000000'
                expect:
                  category: 'PC :: Iso'
                  releaseName: debian live 10 6 0 amd64 standard iso
                  uploader: Anonymous
                  freeleech: ""
                  baseUrl: http://www.tracker01.test/
                  torrentId: "000000"

              - line: 'New Torrent Announcement: <PC :: Iso>  Name:''debian live 10 6 0 amd64 standard iso'' uploaded by ''Anonymous'' freeleech -  http://www.tracker01.test/torrent/000000'
                expect:
                  category: 'PC :: Iso'
                  releaseName: debian live 10 6 0 amd64 standard iso
                  uploader: Anonymous
                  freeleech: freeleech
                  baseUrl: http://www.tracker01.test/
                  torrentId: "000000"

        match:
          infourl: "/torrent/{{ .torrentId }}"
          downloadurl: "/rss/download/{{ .torrentId }}/{{ .rsskey }}/{{ .releaseName }}.torrent"
          encode:
            - releaseName
