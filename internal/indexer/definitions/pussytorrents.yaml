---
version: 2
#id: tracker42
name: PussyTorrents
identifier: pussytorrents
description: PussyTorrents is the adult sister site of the well known TorrentLeech.
language: en-us
urls:
  - https://pussytorrents.org/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: custom
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Copy your RSS key from the RSS feed"
    regex: /([\da-fA-F]{20})

irc:
  network: PussyTorrents
  server: irc.pussytorrents.org
  port: 6021
  tls: true
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#pussytorrents"
      announcers:
        - _PussyBot_
      parse:
        type: single
        lines:
          - pattern: New Torrent Announcement:\s*Name:'(?P<releaseName>.*)' uploaded by '(?P<uploader>[^']*)'\s*(?P<freeleech>freeleech)*\s*-\s*(?P<baseUrl>https?\:\/\/[^\/]+\/)torrent\/(?P<torrentId>\d+)
            tests:
              - line: 'New Torrent Announcement: Name:''BsBigHouse 12 12 21 Kyle Comes To Play XXX 480i MP2 YUSUF'' uploaded by ''Anonymous'' -  https://www.pussytorrents.org/torrent/69'
                expect:
                  releaseName: BsBigHouse 12 12 21 Kyle Comes To Play XXX 480i MP2 YUSUF
                  uploader: Anonymous
                  freeleech: ""
                  baseUrl: https://www.pussytorrents.org/
                  torrentId: "69"

              - line: 'New Torrent Announcement: Name:''BadBus 8 9 98 carter and the lemon XXX 576p MP4 CatStevens'' uploaded by ''Anonymous'' -  https://www.pussytorrents.org/torrent/96'
                expect:
                  releaseName: BadBus 8 9 98 carter and the lemon XXX 576p MP4 CatStevens
                  uploader: Anonymous
                  freeleech: ""
                  baseUrl: https://www.pussytorrents.org/
                  torrentId: "96"

        match:
          infourl: "/torrent/{{ .torrentId }}"
          downloadurl: "/rss/download/{{ .torrentId }}/{{ .rsskey }}/{{ .releaseName }}.torrent"
          encode:
            - releaseName
