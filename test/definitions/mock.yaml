---
version: 2
#id: mock
name: MockIndexer
identifier: mock
description: MockIndexer is a mock indexer.
language: en-us
urls:
  - http://localhost:3999
privacy: private
protocol: torrent
supports:
  - irc
  - api
source: custom
settings:
  - name: rsskey
    type: secret
    label: RSS key
    help: "Go to your profile and copy your RSS key"
    regex: /([\da-fA-F]{20})

irc:
  network: Mock
  server: localhost
  port: 6697
  tls: false
  settings:
    - name: nick
      type: text
      required: true
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#announces"
      announcers:
        - _AnnounceBot_
      parse:
        type: single
        lines:
          - pattern: New Torrent Announcement:\s*<(?P<category>[^>]*)>\s*Name:'(?P<releaseName>.*)' uploaded by '(?P<uploader>[^']*)'\s*(?P<freeleech>freeleech)*\s*-\s*(?P<baseUrl>https?\:\/\/[^\/]+\/)torrent\/(?P<torrentId>\d+)
            tests:
              - line: "New Torrent Announcement: <PC :: Iso>  Name:'debian live 10 6 0 amd64 standard iso' uploaded by 'Anonymous' -  http://localhost:3999/torrent/000000"
                expect:
                  category: "PC :: Iso"
                  releaseName: "debian live 10 6 0 amd64 standard iso"
                  uploader: "Anonymous"
                  freeleech:
                  baseUrl: http://localhost:3999/
                  torrentId: "000000"

        match:
          downloadurl: "/file/{{ .torrentId }}/{{ .releaseName }}.torrent"
          encode:
            - releaseName
